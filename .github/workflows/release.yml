name: release

# Abre o PR de release: VOCÊ dispara "Run workflow" → ele lê `.changes/`,
# calcula o número, monta a seção do CHANGELOG e abre um PR de release em
# português dizendo o que vai sair. Nada é publicado ainda.
#
# Quem escreve (branch, PR) é o token de um GitHub App, NUNCA o GITHUB_TOKEN —
# a razão é uma armadilha documentada pelo próprio GitHub: evento disparado com
# o GITHUB_TOKEN não cria novo workflow run.
#
# O segundo ato do upstream (cortar a tag `vX.Y.Z` automaticamente ao merge
# deste PR, publicar a release, conferir as três/quatro imagens no GHCR, o
# canal `stable` e a vitrine da LP) foi removido NESTE FORK: exigia um GitHub
# App próprio (RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY) que este fork não tem, e
# o job `push:branches:[main]` falhava em TODO push na main — inclusive quem
# nunca mexeu em release. Esta instalação não usa versão numerada: o deploy é
# a cada merge na main, direto pela imagem `latest` (ver
# `.github/workflows/deploy.yml`). Se um dia este fork quiser publicar
# releases numeradas de verdade, é só criar o GitHub App, cadastrar os dois
# secrets e trazer de volta o job `cortar-tag` do upstream — nenhuma melhoria
# dele foi perdida, só não roda sem o App.

on:
  workflow_dispatch: {}

# O GITHUB_TOKEN aqui só clona e lê. Todo escopo de escrita vem do App, o que
# mantém `tests/unit/workflows-tem-permissions.test.ts` sem entrada nova.
permissions:
  contents: read

jobs:
  abrir-pr-de-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # `fetch-depth: 0` porque o corte compara com as tags, e o checkout
          # raso padrão não traz nenhuma.
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Calcular o número e montar a seção
        id: corte
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/cortar-release.ts --escrever | tee /tmp/corte.txt
          versao=$(pnpm exec tsx scripts/cortar-release.ts --versao-do-changelog)
          echo "versao=${versao}" >> "$GITHUB_OUTPUT"

      - name: Abrir o PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSAO: ${{ steps.corte.outputs.versao }}
        run: |
          set -euo pipefail
          git config user.name  'deskcomm-release[bot]'
          git config user.email '${{ steps.token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git checkout -b "release/${VERSAO}"
          git add CHANGELOG.md .changes
          git commit -m "release(${VERSAO}): a versão montada a partir dos fragmentos declarados"
          git push origin "release/${VERSAO}"
          {
            echo "Esta versão sai como **${VERSAO}**, e o número foi CALCULADO a partir do que cada PR declarou — ninguém digitou."
            echo
            echo '```'
            cat /tmp/corte.txt
            echo '```'
            echo
            echo "Este fork não corta tag automaticamente ao merge (ver o cabeçalho deste workflow) — o deploy é a cada merge na main, direto."
            echo "Se algo aqui estiver errado, **feche o PR** em vez de editar o número: corrija o fragmento e dispare o workflow de novo."
          } > /tmp/corpo.md
          gh pr create --base main --head "release/${VERSAO}" \
            --title "Release ${VERSAO}" --body-file /tmp/corpo.md
